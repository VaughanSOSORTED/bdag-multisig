steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_CHAIN_ID=${_NEXT_PUBLIC_CHAIN_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_RPC_URL=${_NEXT_PUBLIC_RPC_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_EXPLORER_URL=${_NEXT_PUBLIC_EXPLORER_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}'
      - '-t'
      - 'europe-west4-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/bdag-multisig-web:latest'
      - '.'

images:
  - 'europe-west4-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/bdag-multisig-web:latest'
